name: samu_localizador
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^13.0.0
  url_launcher: ^6.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Pacote adicionado para gerar os ícones automatizados
  flutter_launcher_icons: "^0.13.1"

# Configuração do ícone oficial do aplicativo usando sua imagem do SAMU
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/simbolosamuapp.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/simbolosamuapp.jpg
