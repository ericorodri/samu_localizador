name: Deploy do App SAMU Nativo

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Limpar Builds Antigos
        run: flutter clean

      - name: Obter dependencias
        run: flutter pub get

      - name: Compilar o APK Nativo do Android
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar o arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-samu-nativo
          path: build/app/outputs/flutter-apk/app-release.apk
